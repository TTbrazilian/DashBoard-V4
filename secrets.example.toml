# ============================================================
# iG2P — secrets.example.toml
# Copie para .streamlit/secrets.toml e preencha com seus valores.
# NUNCA versione o secrets.toml real (já está no .gitignore).
# ============================================================

[gcp_service_account]
type = "service_account"
project_id = "SEU_PROJECT_ID"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "sua-conta@seu-projeto.iam.gserviceaccount.com"
client_id = "..."
token_uri = "https://oauth2.googleapis.com/token"

# IDs das planilhas Google por município (compartilhadas como Leitor com a service account).
[educacao]
"Município Exemplo" = "ID_DA_PLANILHA_DE_EDUCACAO"

[saude]
"Município Exemplo" = "ID_DA_PLANILHA_DE_SAUDE"

[convenios]
"Município Exemplo" = "ID_DA_PLANILHA_DE_CONVENIOS"

[acompanhamentos]
programas = "ID_DA_PLANILHA_DE_PROGRAMAS"
escolas   = "ID_DA_PLANILHA_DE_ESCOLAS"
